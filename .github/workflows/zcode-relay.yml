name: ZCode fork regression
on:
  push:
    branches: [zcode-relay]
  pull_request:
    branches: [zcode-relay]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install isolated test dependencies
        run: python -m pip install -r requirements-zcode.txt -r requirements-history.txt
      - name: Verify relay, history, updates and module boundaries
        run: |
          mkdir -p .tmp
          python -B scripts/test-backend.py --source-only -p test_zcode_relay.py
          python -B scripts/test-backend.py --source-only -p test_store.py
          python -B scripts/test-backend.py --source-only -p test_store_zstd_history.py
          python -B scripts/test-backend.py --source-only -p test_store_history_paths.py
          python -B scripts/test-backend.py --source-only -p test_cli_bridge_integration.py
          python -B scripts/test-backend.py --source-only -p test_api_catalog.py
          python -B scripts/test-backend.py --source-only -p test_mobile_updates.py
          python -B scripts/test-backend.py --source-only -p test_web_assets.py
          python -B scripts/check-boundaries.py
      - name: Verify original mobile resources and connection lifecycle
        run: |
          node --test mobile/tests/*.test.cjs
          python -B scripts/test-mobile-releases.py
          python -B scripts/test-mobile-downloads.py
          python -B scripts/test-zcode-connection.py
      - name: Verify fork update channel
        run: |
          mkdir -p .tmp/mobile-tools
          base=https://repo.maven.apache.org/maven2/com/vaadin/external/google/android-json/0.0.20131108.vaadin1/android-json-0.0.20131108.vaadin1.jar
          curl --fail --location "$base" -o .tmp/mobile-tools/android-json-0.0.20131108.vaadin1.jar
          curl --fail --location "$base.sha1" -o .tmp/mobile-tools/android-json-0.0.20131108.vaadin1.jar.sha1
          python -B scripts/test-zcode-release-channel.py
          python -B scripts/test-zcode-capability-headers.py
